[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elingpt"
version = "0.1.0"
description = "Local MCP connector and agent runner for the ElinGPT Workshop mod"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
elingpt = "elingpt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["elingpt*"]

[tool.setuptools.package-data]
elingpt = ["gameplay_guide.json"]
